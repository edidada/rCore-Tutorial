name: Lab 3+ build
on:
  push:
    branches: ['edidada/lab-3\+']
  pull_request:
    branches: ['edidada/lab-3\+']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install historical Rust toolchain
        run: |
          rustup toolchain install nightly-2020-06-27 --profile minimal
          rustup target add riscv64imac-unknown-none-elf --toolchain nightly-2020-06-27
      - name: Install binary tools
        run: sudo apt-get update && sudo apt-get install -y binutils-riscv64-unknown-elf qemu-system-misc
      - name: Create SFS swap disk
        run: cargo run --manifest-path tools/mkimage/Cargo.toml -- disk.img
      - name: Build kernel
        run: make -C os build OBJCOPY=riscv64-unknown-elf-objcopy
      - name: Verify Clock swapping in QEMU
        run: python3 scripts/test_lab3_plus.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel
          path: |
            os/Cargo.lock
            qemu.log
            tools/mkimage/Cargo.lock
            os/target/riscv64imac-unknown-none-elf/debug/os
            os/target/riscv64imac-unknown-none-elf/debug/kernel.bin
          if-no-files-found: error

