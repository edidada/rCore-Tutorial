name: Lab build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install historical Rust toolchain
        run: |
          rustup toolchain install nightly-2020-06-27 --profile minimal
          rustup target add riscv64imac-unknown-none-elf --toolchain nightly-2020-06-27
      - name: Install binary tools
        run: sudo apt-get update && sudo apt-get install -y binutils-riscv64-unknown-elf
      - name: Build kernel
        run: make -C os build OBJCOPY=riscv64-unknown-elf-objcopy
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            os/target/riscv64imac-unknown-none-elf/debug/os
            os/target/riscv64imac-unknown-none-elf/debug/kernel.bin
          if-no-files-found: error
