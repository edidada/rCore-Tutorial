[package]
name = "os"
version = "0.1.0"
authors = ["涂轶翔 <tyx17@mails.tsinghua.edu.cn>", "赵成钢 <zhaocg17@mails.tsinghua.edu.cn>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# 与 2020 年工具链配套，避免解析到需要新版 Rust 的依赖。
bitflags = "=1.2.1"
bit_field = "=0.10.0"
riscv = { git = "https://github.com/rcore-os/riscv", rev = "21e32ee1dc786cc0d5006ceee0040ce4f8398575", features = ["inline-asm"] }

# panic 时直接终止，因为我们没有实现堆栈展开的功能
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
