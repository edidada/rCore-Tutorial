[package]
name = "os"
version = "0.1.0"
authors = ["涂轶翔 <tyx17@mails.tsinghua.edu.cn>", "赵成钢 <zhaocg17@mails.tsinghua.edu.cn>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zero = "=0.1.2"
either = { version = "=1.5.3", default-features = false }
log = "=0.4.8"
bitvec = { version = "=0.17.4", default-features = false, features = ["alloc"] }
algorithm = { path = 'src/algorithm' }
bit_field = "=0.10.0"
bitflags = "=1.2.1"
buddy_system_allocator = "=0.3.9"
hashbrown = "=0.7.2"
lazy_static = { version = "=1.4.0", features = ["spin_no_std"] }
riscv = { git = "https://github.com/rcore-os/riscv", rev = "21e32ee1dc786cc0d5006ceee0040ce4f8398575", features = ["inline-asm"] }
spin = "=0.5.2"
device_tree = { git = "https://github.com/rcore-os/device_tree-rs", rev = "2fa8411c421c6b4761992fd3d1a9b2427bf0cfc4" }
virtio-drivers = { git = "https://github.com/rcore-os/virtio-drivers", rev = "dfa70e1425c9eac1b30e671be61b557a3ce56e7e" }
rcore-fs = { git = "https://github.com/rcore-os/rcore-fs", rev = "517af47ff3f632f05b91b9ea73a047aa8df363f3"}
rcore-fs-sfs = { git = "https://github.com/rcore-os/rcore-fs", rev = "517af47ff3f632f05b91b9ea73a047aa8df363f3"}
xmas-elf = "=0.7.0"
k210-hal = { path = "../tools/k210-hal", optional = true }
k210-pac = { path = "../tools/k210-pac", optional = true }

[features]
board_qemu = []
board_k210 = ["k210-hal", "k210-pac"]

# panic 时直接终止，因为我们没有实现堆栈展开的功能
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"

[build-dependencies]
regex = "=1.3.9"
lazy_static = "=1.4.0"
memchr = "=2.3.3"
thread_local = "=1.0.1"
